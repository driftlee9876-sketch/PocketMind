name: Build PocketMind Wired for Windows
on:
  workflow_dispatch:
  push:
    branches: [ feat/pocketmind-foundation ]
    paths: [ 'workers/windows/wired.py', 'workers/windows/test_wired.py', '.github/workflows/windows-wired.yml' ]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test USB pairing and model split configuration
        run: python -m unittest discover -s workers/windows -p test_wired.py
      - name: Build Windows companion
        run: |
          python -m pip install pyinstaller==6.16.0
          python -m PyInstaller --noconfirm --onefile --windowed --name PocketMind-Wired workers/windows/wired.py
      - uses: actions/upload-artifact@v4
        with:
          name: PocketMind-Wired-Windows
          path: dist/PocketMind-Wired.exe
          if-no-files-found: error
          retention-days: 14
