name: PocketMind Quality Checks

on:
  pull_request:
    branches: [ main, master ]
  push:
    branches: [ feat/pocketmind-foundation ]

permissions:
  contents: read

jobs:
  typescript:
    name: TypeScript and Jest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm install --legacy-peer-deps
      - name: TypeScript validation
        run: npm run typecheck
      - name: Unit tests
        run: npm test -- --runInBand

  coordinator:
    name: Worker coordinator integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check coordinator JavaScript syntax
        working-directory: worker-server
        run: node --check server.js
      - name: Coordinator integration tests
        working-directory: worker-server
        run: npm test

  windows-worker:
    name: Windows Worker Python syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Windows Worker source
        run: python -m py_compile workers/windows/worker.py
