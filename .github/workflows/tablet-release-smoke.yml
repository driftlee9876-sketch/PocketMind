name: Galaxy Tab release APK smoke
on:
  push:
    branches: [test/tablet-apk-bf01b96]
permissions:
  contents: read
  actions: read
jobs:
  tablet:
    runs-on: ubuntu-latest
    timeout-minutes: 85
    env:
      POCKETMIND_API_TOKEN: emulator-only-api-token-for-fixtures
      POCKETMIND_ENROLLMENT_TOKEN: emulator-only-enrollment-for-fixtures
      POCKETMIND_PUBLIC_BASE_URL: https://coordinator.example.invalid
      POCKETMIND_TOKEN_ENCRYPTION_KEY: emulator-only-encryption-secret-for-fixtures
      GOOGLE_OAUTH_CLIENT_ID: emulator.apps.googleusercontent.com
      GOOGLE_OAUTH_CLIENT_SECRET: emulator-only-client
      HOST: 127.0.0.1
      PORT: 18770
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Wait for the target release APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          while true; do
            result=$(gh run view 45289541891 --json status,conclusion --jq '.status + "/" + .conclusion')
            case "$result" in
              completed/success) break ;;
              completed/*) echo "$result"; exit 1 ;;
            esac
            sleep 30
          done
      - uses: actions/download-artifact@v4
        with:
          name: PocketMind-GalaxyTab-APK
          run-id: 45289541891
          github-token: ${{ github.token }}
          path: release
      - uses: actions/download-artifact@v4
        with:
          name: PocketMind-GalaxyTab-APK
          run-id: 45180768385
          github-token: ${{ github.token }}
          path: baseline
      - uses: actions/checkout@v4
        with:
          ref: 083721195e7d8073a8f880a4b6438c7f27e76196
          path: release-source
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.11'
          cache: false
      - name: Prepare native Bonjour and TLS fixtures
        run: |
          bash tests/wifi/advert/build.sh
          cp tests/wifi/fixture.go release-source/workers/wifi/fixture.go
          (cd release-source/workers/wifi && go build -o "$RUNNER_TEMP/pm-donor" ./fixture.go)
          sudo ip addr add 192.168.246.1/32 dev lo
          sudo ip addr add 192.168.246.2/32 dev lo
          "$RUNNER_TEMP/pm-donor" "$RUNNER_TEMP/donor-data" > "$RUNNER_TEMP/pm-donor.log" 2>&1 &
      - name: Prepare isolated test services
        run: |
          sudo chmod a+rw /dev/kvm
          python -m pip install uiautomator2==3.2.10
          mkdir evidence
          POCKETMIND_DATA_FILE="$RUNNER_TEMP/tablet-state.json" node --require ./tests/tablet/google-fixture.cjs worker-server/server.js > evidence/coordinator.log 2>&1 &
          for attempt in {1..15}; do curl -fsS http://127.0.0.1:18770/v1/health && break; sleep 1; done
          python tests/tablet/seed.py
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_c
          ram-size: 4096M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: |
            adb shell getprop ro.product.cpu.abilist
            adb install -r "$RUNNER_TEMP/pm-advert.apk"
            adb install -r baseline/app-release.apk
            adb reverse tcp:18770 tcp:18770
            python tests/tablet/smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tablet-test-evidence
          path: evidence/
          retention-days: 7

  model-over-wifi:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 083721195e7d8073a8f880a4b6438c7f27e76196
          path: release-source
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.11'
          cache: false
      - name: Generate text over two paired TLS connections
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 https://github.com/ggml-org/llama.cpp/releases/download/b12651/llama-b12651-bin-ubuntu-x64.tar.gz -o "$RUNNER_TEMP/runtime.tar.gz"
          echo "17b242259181d5b1b1f7719aba27929700a8b0dab39bfaef1b971a992b397b38  $RUNNER_TEMP/runtime.tar.gz" | sha256sum -c
          mkdir "$RUNNER_TEMP/llama"
          tar xf "$RUNNER_TEMP/runtime.tar.gz" -C "$RUNNER_TEMP/llama"
          export POCKETMIND_RPC=$(find "$RUNNER_TEMP/llama" -type f -name '*rpc-server' -print -quit)
          export POCKETMIND_HOST=$(find "$RUNNER_TEMP/llama" -type f -name llama-server -print -quit)
          export LD_LIBRARY_PATH="$(dirname "$POCKETMIND_HOST")"
          export POCKETMIND_MODEL="$RUNNER_TEMP/stories.gguf"
          curl -fsSL --retry 3 https://huggingface.co/ggml-org/models/resolve/499bc8821c6b12b4e53c5bffcb21ec206f212d81/tinyllamas/stories260K.gguf -o "$POCKETMIND_MODEL"
          echo "270cba1bd5109f42d03350f60406024560464db173c0e387d91f0426d3bd256d  $POCKETMIND_MODEL" | sha256sum -c
          sudo ip addr add 192.168.246.1/32 dev lo
          sudo ip addr add 192.168.246.2/32 dev lo
          export POCKETMIND_COMPLETION_TEST="$PWD/tests/wifi/completion.py"
          export POCKETMIND_WINDOWS_SOURCE="$PWD/release-source/workers/windows"
          cp tests/wifi/model_linux_test.go release-source/workers/wifi/link/
          cd release-source/workers/wifi
          go test -v -race -run TestWifiModelCompletion -timeout 3m ./link
