name: Build PocketMind Android APK

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - 'ios/**'
      - 'codemagic.yaml'
      - '*.md'
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Generate Release Keystore for Standalone APK
        run: |
          keytool -genkeypair -v -noprompt -storetype PKCS12 \
            -keystore android/app/my-upload-key.keystore \
            -alias my-key-alias \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass pocketmind123 -keypass pocketmind123 \
            -dname "CN=PocketMind, OU=Mobile, O=PocketMind, L=Seoul, S=Seoul, C=KR"

      - name: Build arm64-v8a Release APK (Fast)
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleRelease \
            -PreactNativeArchitectures=arm64-v8a \
            -Pandroid.injected.signing.store.file=$(pwd)/app/my-upload-key.keystore \
            -Pandroid.injected.signing.store.password=pocketmind123 \
            -Pandroid.injected.signing.key.alias=my-key-alias \
            -Pandroid.injected.signing.key.password=pocketmind123 \
            -x lint \
            --no-daemon \
            --max-workers=2

      - name: Upload PocketMind APK
        uses: actions/upload-artifact@v4
        with:
          name: PocketMind-GalaxyTab-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 14
