name: Build PocketMind Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - feat/pocketmind-foundation

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Cache pinned Android GPU peer
        id: gpu-cache
        uses: actions/cache@v4
        with:
          path: android/app/build/wired
          key: android-usb-gpu-a8f8294c45-${{ hashFiles('workers/android-gpu/*', '.github/workflows/android-apk.yml') }}
      - uses: actions/checkout@v4
        if: steps.gpu-cache.outputs.cache-hit != 'true'
        with:
          repository: ggml-org/llama.cpp
          ref: a8f8294c45076538f4509754e4c79fc51a1a486b
          path: build/pocketmind-llama
          persist-credentials: false
      - uses: actions/checkout@v4
        if: steps.gpu-cache.outputs.cache-hit != 'true'
        with:
          repository: KhronosGroup/Vulkan-Headers
          ref: d277a0a3cda9c682708c93279f0c72cd6b0ae3f3
          path: build/pocketmind-vulkan
          persist-credentials: false
      - uses: actions/checkout@v4
        if: steps.gpu-cache.outputs.cache-hit != 'true'
        with:
          repository: KhronosGroup/SPIRV-Headers
          ref: fb1379425b16e58dcbdda7be0f8604a7f5cdce78
          path: build/pocketmind-spirv
          persist-credentials: false
      - name: Build Vulkan GPU peer for trusted USB connections
        if: steps.gpu-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y glslc ninja-build
          if [ ! -d "$ANDROID_HOME/ndk/27.1.12297006" ]; then
            sdk_manager=$(find "$ANDROID_HOME" -type f -path '*/bin/sdkmanager' | sort -V | tail -1)
            "$sdk_manager" "ndk;27.1.12297006"
          fi
          ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.1.12297006" bash workers/android-gpu/build.sh

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.11'
          cache: false
      - name: Test paired Wi-Fi protocol and build Android transport
        run: |
          (cd workers/wifi && go test -race ./...)
          ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.1.12297006" bash workers/wifi/build-native.sh android

      - name: Generate PocketMind Android Launcher Icons
        run: |
          python3 - << 'EOF'
          import os, struct, zlib

          def make_png(size, is_round=False):
              raw = bytearray()
              cx = cy = size / 2.0
              r_outer = size * 0.46
              for y in range(size):
                  raw.append(0)
                  for x in range(size):
                      dx = x - cx
                      dy = y - cy
                      dist = (dx*dx + dy*dy) ** 0.5
                      # 사각형 둥근 모서리 또는 원형 마스크
                      if is_round:
                          inside = dist <= r_outer
                      else:
                          corner = size * 0.22
                          ax, ay = abs(dx), abs(dy)
                          limit = size * 0.46
                          if ax > limit or ay > limit:
                              inside = False
                          elif ax > limit - corner and ay > limit - corner:
                              inside = ((ax - (limit - corner))**2 + (ay - (limit - corner))**2) ** 0.5 <= corner
                          else:
                              inside = True
                      if not inside:
                          raw.extend((0, 0, 0, 0))
                          continue
                      # 중앙 AI 스파크(다이아몬드 별) 문양
                      star = (abs(dx) ** 0.65 + abs(dy) ** 0.65) <= (size * 0.28) ** 0.65
                      if star:
                          raw.extend((255, 255, 255, 255))
                      else:
                          # 다크 에메랄드-블루 그라데이션 배경
                          t = (x + y) / (2.0 * size)
                          r = int(16 + t * 20)
                          g = int(163 - t * 40)
                          b = int(127 + t * 80)
                          raw.extend((r, g, b, 255))

              def chunk(tag, data):
                  return struct.pack("!I", len(data)) + tag + data + struct.pack("!I", zlib.crc32(tag + data) & 0xffffffff)

              ihdr = struct.pack("!IIBBBBB", size, size, 8, 6, 0, 0, 0)
              return b"\x89PNG\r\n\x1a\n" + chunk(b"IHDR", ihdr) + chunk(b"IDAT", zlib.compress(bytes(raw), 9)) + chunk(b"IEND", b"")

          res_dir = "android/app/src/main/res"
          for sub in ["mipmap-anydpi-v26", "mipmap-anydpi"]:
              p = os.path.join(res_dir, sub)
              if os.path.isdir(p):
                  for f in os.listdir(p):
                      os.remove(os.path.join(p, f))

          densities = {
              "mipmap-mdpi": 48,
              "mipmap-hdpi": 72,
              "mipmap-xhdpi": 96,
              "mipmap-xxhdpi": 144,
              "mipmap-xxxhdpi": 192,
          }
          for folder, px in densities.items():
              out_dir = os.path.join(res_dir, folder)
              os.makedirs(out_dir, exist_ok=True)
              with open(os.path.join(out_dir, "ic_launcher.png"), "wb") as f:
                  f.write(make_png(px, False))
              with open(os.path.join(out_dir, "ic_launcher_round.png"), "wb") as f:
                  f.write(make_png(px, True))
          print("PocketMind Android launcher icons generated successfully.")
          EOF

      - name: Ensure Fixed Signing Keystore
        run: |
          if [ ! -f android/app/debug.keystore ]; then
            keytool -genkeypair -v -noprompt -storetype PKCS12 \
              -keystore android/app/debug.keystore \
              -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build arm64-v8a Release APK (Fixed Signature)
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleRelease \
            -PreactNativeArchitectures=arm64-v8a \
            -Pandroid.injected.signing.store.file=$(pwd)/app/debug.keystore \
            -Pandroid.injected.signing.store.password=android \
            -Pandroid.injected.signing.key.alias=androiddebugkey \
            -Pandroid.injected.signing.key.password=android \
            -x lint \
            --no-daemon \
            --max-workers=2

      - name: Verify the arm64 GPU peer in the signed APK
        run: |
          python3 - <<'PYTHON'
          from zipfile import ZipFile
          from pathlib import Path
          import re
          import subprocess
          import tempfile
          android_libraries = {'libc.so', 'libm.so', 'libdl.so', 'libvulkan.so', 'liblog.so', 'libandroid.so', 'libz.so'}
          with ZipFile('android/app/build/outputs/apk/release/app-release.apk') as apk:
              assert apk.getinfo('lib/arm64-v8a/libpmwifi.so').file_size > 0
              for binary in ['libpocketmind_usb_gpu.so', 'libpocketmind_tablet_host.so']:
                  with apk.open('lib/arm64-v8a/' + binary) as peer:
                      contents = peer.read()
                      header = contents[:20]
                  with tempfile.TemporaryDirectory() as directory:
                      executable = Path(directory) / binary
                      executable.write_bytes(contents)
                      dynamic = subprocess.check_output(['readelf', '-d', executable], text=True)
                      extra = set(re.findall(r'Shared library: \[(.*?)\]', dynamic)) - android_libraries
                      assert not extra, (binary, 'Unbundled runtime dependencies', extra)
                  assert header[:4] == bytes.fromhex('7f454c46') and int.from_bytes(header[18:20], 'little') == 183
              assert apk.getinfo('assets/licenses/llama.cpp.txt').file_size > 0
          PYTHON

      - name: Upload PocketMind APK
        uses: actions/upload-artifact@v4
        with:
          name: PocketMind-GalaxyTab-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 14
